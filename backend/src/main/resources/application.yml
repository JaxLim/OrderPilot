server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: orderpilot
  config:
    # Local dev convenience: read secrets from a git-ignored .env (repo root or backend/). In Docker they come from env vars.
    import: "optional:file:./.env[.properties],optional:file:../.env[.properties]"
  autoconfigure:
    # JWT-only authentication: no in-memory default user
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DB:orderpilot}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:orderpilot}
    password: ${MYSQL_PASSWORD:orderpilot}
    hikari:
      maximum-pool-size: 30
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        prefetch: 20
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 500ms
          multiplier: 2
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
  ai:
    model:
      # only the chat model is used; don't create speech/image/embedding/moderation clients
      audio:
        speech: none
        transcription: none
      image: none
      embedding: none
      moderation: none
    # DeepSeek (or any OpenAI-compatible provider) through Spring AI's OpenAI client.
    # The key is never written here: it is read from the AI_API_KEY environment variable / .env.
    openai:
      api-key: ${AI_API_KEY:not-configured}
      base-url: ${AI_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${AI_MODEL:deepseek-chat}
          temperature: 0.2

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  swagger-ui:
    path: /swagger-ui.html

orderpilot:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-0123456789abcdef0123456789abcdef}
    ttl: 8h
  order:
    payment-timeout: ${ORDER_PAYMENT_TIMEOUT:15m}
  outbox:
    poll-interval-ms: 500
    batch-size: 50
    max-attempts: 10
  ai:
    # LLM mode is switched on by AiKeyEnvironmentPostProcessor when AI_API_KEY is non-blank;
    # otherwise the built-in offline analyst answers. These two values are shown in the UI (never the key).
    provider: ${AI_PROVIDER_NAME:DeepSeek}
    model: ${AI_MODEL:deepseek-chat}
  demo:
    seed: ${DEMO_SEED:true}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:8081}

logging:
  level:
    com.orderpilot: INFO
