server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: orderpilot
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DB:orderpilot}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:orderpilot}
    password: ${MYSQL_PASSWORD:orderpilot}
    hikari:
      maximum-pool-size: 30
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        prefetch: 20
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 500ms
          multiplier: 2
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:not-configured}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: 0.2

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  swagger-ui:
    path: /swagger-ui.html

orderpilot:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-0123456789abcdef0123456789abcdef}
    ttl: 8h
  order:
    payment-timeout: ${ORDER_PAYMENT_TIMEOUT:15m}
  outbox:
    poll-interval-ms: 500
    batch-size: 50
    max-attempts: 10
  ai:
    # LLM mode is used when an API key is configured; otherwise the built-in offline analyst answers.
    api-key: ${OPENAI_API_KEY:}
  demo:
    seed: ${DEMO_SEED:true}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:8081}

logging:
  level:
    com.orderpilot: INFO
